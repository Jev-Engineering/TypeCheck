<title id="title">TypeCheck browser-assisted onboarding</title><desc id="desc">Activity SDK authentication or standalone Discord OAuth establishes live administrator authority. Browser tools preview a plan. A human accepts it before the scoped management API transaction applies disabled rules, settings and a receipt. Enforcement activation remains separate. The tested Discord iframe denies the tools policy; use standalone.</desc>
