<text x="45" y="105" font-size="17">Discord Activity / SDK</text><text x="45" y="133" font-size="13">Iframe tools: denied by parent policy</text><text x="45" y="155" font-size="13">Manual fallback / dashboard link</text><text x="45" y="230" font-size="17">Standalone browser / OAuth</text><text x="45" y="257" font-size="13">Own redirect, state and session</text><text x="45" y="280" font-size="13">Native tools + real OAuth tested</text>
<text x="380" y="158" font-size="17">Inspect → preview plan</text><text x="380" y="188" font-size="14">Human accepts exact digest</text><text x="380" y="216" font-size="14">Agent/UI applies accepted plan</text><text x="380" y="243" font-size="13">Live guild authority on every call</text>
<text x="685" y="158" font-size="17">Guild SQL transaction</text><text x="685" y="188" font-size="14">Disabled review rules + settings</text><text x="685" y="216" font-size="14">Atomic audit + retryable receipt</text><text x="685" y="243" font-size="14">ENFORCEMENT OFF</text><text x="30" y="345" font-size="16">Credentials, calibration, approval and activation remain separate human flows.</text><text x="30" y="375" font-size="14">Browser WebMCP only · No remote MCP server · No deployment or live acceptance claim</text></g></svg>
