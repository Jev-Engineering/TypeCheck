name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-root
          MYSQL_DATABASE: guard_test
          MYSQL_USER: guard
          MYSQL_PASSWORD: test-only-password
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: |
          npm run test:mysql > evidence/mysql-ci.txt 2>&1
          node scripts/test-hash-databases.mjs >> evidence/mysql-ci.txt 2>&1
          node scripts/test-historical-persistence.mjs >> evidence/mysql-ci.txt 2>&1
        env:
          TEST_DATABASE_URL: mysql://guard:test-only-password@127.0.0.1:3306/guard_test
          ALLOW_DATABASE_TESTS: 'true'
      - name: Verify cost-ledger upgrade on disposable MySQL database
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -ptest-only-root -e "CREATE DATABASE cost_test; GRANT ALL ON cost_test.* TO 'guard'@'%';"
          node scripts/test-cost-databases.mjs > evidence/cost-mysql-ci.txt 2>&1
        env:
          TEST_DATABASE_URL: mysql://guard:test-only-password@127.0.0.1:3306/cost_test
          ALLOW_DATABASE_TESTS: 'true'
      - name: Back up a populated database before migrating and restore it with the mysql client
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -ptest-only-root -e "CREATE DATABASE backup_test; CREATE DATABASE backup_restore; GRANT ALL ON backup_test.* TO 'guard'@'%'; GRANT ALL ON backup_restore.* TO 'guard'@'%';"
          node scripts/test-backup-databases.mjs 2>&1 | tee evidence/backup-mysql-ci.txt
        env:
          TEST_DATABASE_URL: mysql://guard:test-only-password@127.0.0.1:3306/backup_test
          RESTORE_DATABASE_URL: mysql://guard:test-only-password@127.0.0.1:3306/backup_restore
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          ALLOW_DATABASE_TESTS: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-validation
          path: |
            evidence/mysql-ci.txt
            evidence/cost-mysql-ci.txt
            evidence/backup-mysql-ci.txt
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: guard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U guard -d guard_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: node scripts/review-dependencies.mjs
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node --test scripts/release-guard.test.mjs scripts/release-source.test.mjs scripts/migration-receipt.test.mjs scripts/hosting-handoff.test.mjs
      - run: node dist/server/migrate.js
        env:
          DATABASE_URL: postgresql://guard:test-only-password@localhost:5432/guard_test
      - run: |
          npm run test:postgres
          node scripts/test-hash-databases.mjs
          node scripts/test-historical-persistence.mjs
        env:
          TEST_DATABASE_URL: postgresql://guard:test-only-password@localhost:5432/guard_test
          ALLOW_DATABASE_TESTS: 'true'
      - name: Verify cost-ledger upgrade on disposable PostgreSQL database
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U guard cost_test
          node scripts/test-cost-databases.mjs > evidence/cost-postgres-ci.txt 2>&1
        env:
          TEST_DATABASE_URL: postgresql://guard:test-only-password@127.0.0.1:5432/cost_test
          ALLOW_DATABASE_TESTS: 'true'
      - run: npm run test:compose
      - name: Scan final runtime image (unresolved high findings block release)
        run: |
          IMAGE="$(node -e "console.log(JSON.parse(require('fs').readFileSync('evidence/container-result.json')).project + '-app:latest')")"
          docker save "$IMAGE" -o /tmp/jev-image.tar
          docker run --rm -v /tmp/jev-image.tar:/scan/image.tar:ro -v "$PWD/evidence:/report" aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /report/container-vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-validation
          path: |
            evidence/container-validation.json
            evidence/container-result.json
            evidence/postgres-validation.txt
            evidence/container-vulnerabilities.json
            evidence/dependency-licenses.json
            evidence/cost-postgres-ci.txt
