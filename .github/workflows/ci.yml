name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: guard_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U guard -d guard_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: node scripts/review-dependencies.mjs
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node dist/server/migrate.js
        env:
          DATABASE_URL: postgresql://guard:test-only-password@localhost:5432/guard_test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://guard:test-only-password@localhost:5432/guard_test
          ALLOW_DATABASE_TESTS: 'true'
      - run: npm run test:compose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-validation
          path: |
            evidence/container-validation.json
            evidence/container-result.json
            evidence/postgres-validation.txt
