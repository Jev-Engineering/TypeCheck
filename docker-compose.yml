services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: guard
      POSTGRES_DB: guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d guard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    init: true
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://guard:${POSTGRES_PASSWORD}@db:5432/guard
      OBJECT_DIR: /data/objects
      PORT: "3000"
      API_ONLY: "0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - image_objects:/data/objects
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1536m
volumes:
  database:
  image_objects:
